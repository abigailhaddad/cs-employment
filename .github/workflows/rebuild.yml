name: Rebuild data from IPUMS

# Manual only. Re-submits the IPUMS USA extract, regenerates
# data/employment_rates.csv and web/data/*.json, runs the checks, and opens a
# PR from a regen/<run-id> branch. It never pushes to the default branch and
# never commits raw IPUMS microdata.
on:
  workflow_dispatch:
    inputs:
      extract_number:
        description: "Optional: resume an IPUMS USA extract already submitted (skips submission). Leave blank for a fresh extract."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      IPUMS_API_KEY: ${{ secrets.IPUMS_API_KEY }}
      EXTRACT_NUMBER: ${{ inputs.extract_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install pinned requirements
        run: pip install -r requirements-ci.txt

      - name: Fail early if the secret is missing
        run: |
          if [ -z "$IPUMS_API_KEY" ]; then
            echo "::error::Repository secret IPUMS_API_KEY is not set (create a key at https://account.ipums.org/api_keys)"
            exit 1
          fi

      - name: Submit IPUMS extract, wait, download (raw data stays untracked)
        run: |
          df -h .
          args=()
          if [ -n "$EXTRACT_NUMBER" ]; then
            case "$EXTRACT_NUMBER" in
              *[!0-9]*) echo "::error::extract_number must be digits only"; exit 1 ;;
            esac
            args=(--extract-number "$EXTRACT_NUMBER")
          fi
          python scripts/resubmit_extract.py --timeout-seconds 19800 "${args[@]}"
          df -h .

      - name: Regenerate (extract filter, analysis, web JSON)
        run: python run_all.py

      - name: Checks
        run: python scripts/check_outputs.py --summary .rebuild/summary.md

      - name: Show summary
        if: always()
        run: |
          if [ -f .rebuild/summary.md ]; then cat .rebuild/summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Only allowed files changed, and no microdata staged
        run: |
          git status --porcelain
          changed=$(git status --porcelain | awk '{print $2}')
          for f in $changed; do
            case "$f" in
              data/employment_rates.csv|web/data/*.json) ;;
              *) echo "::error::Unexpected change: $f"; exit 1 ;;
            esac
          done
          if git ls-files -o --exclude-standard | grep -E '(^|/)usa_|\.dat|\.parquet' ; then
            echo "::error::Untracked microdata-like file not ignored"; exit 1
          fi

      - name: Push regen branch and open PR
        run: |
          branch="regen/${GITHUB_RUN_ID}"
          if git diff --quiet; then
            echo "No output changes; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/employment_rates.csv web/data/*.json
          git commit -m "Regenerate employment rates and web data from a fresh IPUMS extract" \
                     -m "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/${branch}"
          base="${{ github.event.repository.default_branch }}"
          {
            echo "Regenerated from a fresh IPUMS USA extract by workflow run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
            echo
            echo "Only \`data/employment_rates.csv\` and \`web/data/*.json\` changed. **The numbers typed into \`web/index.html\` (prose and the hard-coded values in its script) were not updated; edit them by hand from the tables below.**"
            echo
            cat .rebuild/summary.md
          } > .rebuild/pr_body.md
          if gh pr create --base "$base" --head "$branch" \
               --title "Regenerate data from fresh IPUMS extract (run ${GITHUB_RUN_ID})" \
               --body-file .rebuild/pr_body.md; then
            echo "PR opened."
          else
            echo "::warning::Could not open a PR (repo setting 'Allow GitHub Actions to create and approve pull requests' may be off)."
            echo "Branch pushed. Open it here: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${base}...${branch}?expand=1"
            echo "Branch pushed. Compare: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${base}...${branch}?expand=1" >> "$GITHUB_STEP_SUMMARY"
          fi
